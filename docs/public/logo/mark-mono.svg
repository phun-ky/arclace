  <circle cx="20" cy="4.5" r="2.5" fill="currentColor"/>
  <circle cx="20" cy="12" r="2.5" fill="currentColor"/>
  <circle cx="20" cy="19.5" r="2.5" fill="currentColor"/>
</svg>
