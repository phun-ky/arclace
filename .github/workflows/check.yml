name: Checks

on:
  # Every pull request, with no path filter: check is a required check, and a
  # PR it skipped could never merge
  pull_request:
    branches: ['main']
    types: [opened, synchronize, reopened]
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # check:pack also runs the packed package on the oldest Node engines allows
      - name: Setup Node.js 22.12.0, the engines floor
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.12.0
      - name: Remember the engines floor Node
        run: echo "CHECK_PACK_NODE=$(command -v node)" >> "$GITHUB_ENV"
      - name: Setup Node.js environment
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Lint # Code, config and Markdown
        run: npm run lint
      - name: Typecheck # Source and tests
        run: npm run typecheck
      - name: Test # With coverage thresholds
        run: npm run test:ci
      - name: Build
        run: npm run build
      - name: Check package # Packs, installs and imports the package from every entry point, on Node 24 and the engines floor
        run: npm run check:pack
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: phun-ky/connect-the-things
          files: coverage/cobertura-coverage.xml

  notify:
    name: Notify failed check
    needs: check
    if: failure()
    runs-on: ubuntu-24.04
    # GITHUB_TOKEN, not GH_TOKEN: secrets are empty on Dependabot pull requests
    permissions:
      issues: write
    steps:
      - uses: drivendataorg/failed-build-issue-action@940568ce50eeef3f31a920614cefcc6102d2f930 # v1.3.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          label-name: 'problems: 💔 build failed'
          # Don't recreate a missing label under another name
          create-label: false
