version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    # Minor and patch updates are grouped into one PR a week. Majors are not,
    # so each one gets its own PR to test and merge, and one blocked major does
    # not hold back the others
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - 'minor'
          - 'patch'
    ignore:
      # Keep @types/node on the Node major used by CI (24)
      - dependency-name: '@types/node'
        update-types:
          - 'version-update:semver-major'
      # typescript-eslint (via eslint-config-phun-ky) peers on typescript
      # <6.1.0. Remove once it supports newer versions
      - dependency-name: 'typescript'
        versions: ['>=6.1']
    schedule:
      interval: 'weekly'
    # Wait two weeks after a release before proposing it, so a broken or
    # compromised release is likely caught first. Security updates are not
    # delayed
    cooldown:
      default-days: 14
    labels:
      - 'mindless: 📦 dependencies'
    commit-message:
      prefix: 'chore: 🤖 '
    # One minor-and-patch group plus room for separate majors
    open-pull-requests-limit: 5
    allow:
      - dependency-type: direct

  # Actions are pinned to commit SHAs; this keeps the pins and their version
  # comments up to date
  - package-ecosystem: 'github-actions'
    directory: '/'
    # Same grouping as npm: minor and patch together, each major on its own
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - 'minor'
          - 'patch'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 14
    labels:
      - 'mindless: 📦 dependencies'
    commit-message:
      prefix: 'ci: 🎡 '
